name: Publish Thermal Glow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified release source
        if: hashFiles('thermal-glow-source.zip') != ''
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('thermal-glow-source.zip') as z:
              for n in z.namelist():
                  if n.startswith('/') or '..' in n.split('/') or n.startswith('.git/'):
                      raise SystemExit('Unsafe archive entry')
              z.extractall('.')
          PY
          rm thermal-glow-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish Thermal Glow 2026.11.18 source and verified firmware'
          git push
      - name: Verify firmware integrity
        run: |
          cd docs/firmware
          sha256sum -c SHA256SUMS.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
